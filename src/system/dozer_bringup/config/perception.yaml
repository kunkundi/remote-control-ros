# 六路相机配置；默认仅启用前双目，perception_cameras 指定实际推理名单。
yolo_front_left:
  ros__parameters:
    image_backend: shm
    shm_name: dozer_camera_front_left
    image_topic: /camera/front_left/image_small
    detections_topic: /perception/front_left/detections
    source_id: front_left
    model_path: /home/nvidia/workspace/ros2_ws/src/perception/dozer_perception/model/best.pt
    confidence: 0.25
    device: 0
