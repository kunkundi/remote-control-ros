# 共享内存模式下任意非空相机名单共用一个固定 batch=6 的 INT8 TensorRT 节点。
yolo_batch:
  ros__parameters:
    confidence: 0.25
    device: 0
    shm_prefix: dozer_camera_
    max_frame_age_sec: 0.2
    batch_wait_sec: 0.04
yolo_front_left:
  ros__parameters:
    image_backend: shm
    shm_name: dozer_camera_front_left
    image_topic: /camera/front_left/image_small
    detections_topic: /perception/front_left/detections
    source_id: front_left
    confidence: 0.25
    device: 0
yolo_front_right:
  ros__parameters:
    image_backend: shm
    shm_name: dozer_camera_front_right
    image_topic: /camera/front_right/image_small
    detections_topic: /perception/front_right/detections
    source_id: front_right
    confidence: 0.25
    device: 0
yolo_rear:
  ros__parameters:
    image_backend: shm
    shm_name: dozer_camera_rear
    image_topic: /camera/rear/image_small
    detections_topic: /perception/rear/detections
    source_id: rear
    confidence: 0.25
    device: 0
yolo_front:
  ros__parameters:
    image_backend: shm
    shm_name: dozer_camera_front
    image_topic: /camera/front/image_small
    detections_topic: /perception/front/detections
    source_id: front
    confidence: 0.25
    device: 0
yolo_left:
  ros__parameters:
    image_backend: shm
    shm_name: dozer_camera_left
    image_topic: /camera/left/image_small
    detections_topic: /perception/left/detections
    source_id: left
    confidence: 0.25
    device: 0
yolo_right:
  ros__parameters:
    image_backend: shm
    shm_name: dozer_camera_right
    image_topic: /camera/right/image_small
    detections_topic: /perception/right/detections
    source_id: right
    confidence: 0.25
    device: 0
