# 六路相机暂按 video0-video5 映射；物理安装方向尚未核对。
# 每路 1920x1080 以 3 倍降采样发布 640x360 BGR 图像，目标 30 Hz。
# 仅供 ROS 图像回退模式使用；默认由 edge 直采，不能同时启动这些节点。
camera_front_left:
  ros__parameters:
    camera_name: front_left
    device: /dev/video0
    width: 1920
    height: 1080
    small_image_downscale: 3
    small_image_max_fps: 30.0
camera_front_right:
  ros__parameters:
    camera_name: front_right
    device: /dev/video1
    width: 1920
    height: 1080
    small_image_downscale: 3
    small_image_max_fps: 30.0
camera_front:
  ros__parameters:
    camera_name: front
    device: /dev/video2
    width: 1920
    height: 1080
    small_image_downscale: 3
    small_image_max_fps: 30.0
camera_rear:
  ros__parameters:
    camera_name: rear
    device: /dev/video3
    width: 1920
    height: 1080
    small_image_downscale: 3
    small_image_max_fps: 30.0
camera_left:
  ros__parameters:
    camera_name: left
    device: /dev/video4
    width: 1920
    height: 1080
    small_image_downscale: 3
    small_image_max_fps: 30.0
camera_right:
  ros__parameters:
    camera_name: right
    device: /dev/video5
    width: 1920
    height: 1080
    small_image_downscale: 3
    small_image_max_fps: 30.0
