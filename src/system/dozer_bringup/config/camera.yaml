# 当前实机联调只用 video0/video1；物理安装方向尚未核对。
# 两路 1920x1080 以 3 倍降采样发布 640x360 BGR 图像。
# rtc_edge 与本节点不可同时占用这些设备。
camera_front_left:
  ros__parameters:
    camera_name: front_left
    device: /dev/video0
    width: 1920
    height: 1080
    small_image_downscale: 3
    small_image_max_fps: 5.0
camera_front_right:
  ros__parameters:
    camera_name: front_right
    device: /dev/video1
    width: 1920
    height: 1080
    small_image_downscale: 3
    small_image_max_fps: 5.0
