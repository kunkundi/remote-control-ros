# dozer_radar_sr73f 参数。
# 三台雷达均按 SensorID 配置；实机启用前确认 CAN 总线与安装方向。
radar_sr73f:
  ros__parameters:
    can_interface: can0
    replay_file: ""          # 非空时回放 candump -l 日志，不读 CAN
    replay_loop: true
    flip_lateral: true       # SR73F 横向右正，转为 REP-103 左正
    publish_pointcloud: true # 有订阅者时发布 /radar/<name>/points 供 rviz/foxglove 查看
    offline_timeout_ms: 500
    cycle_timeout_ms: 100
    radar_names: ["front_left", "front_right", "rear"]
    front_left:
      sensor_id: 0
      frame_id: radar_front_left
    front_right:
      sensor_id: 1
      frame_id: radar_front_right
    rear:
      sensor_id: 2
      frame_id: radar_rear
